{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 450px;">
    <h2><i class="fa-solid fa-right-to-bracket"></i> Welcome Back</h2>
    
    <form action="/login" method="POST">
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>Email Address</label>
            <input type="email" name="email" required placeholder="name@example.com">
        </div>
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn-primary" style="margin-top: 0;">
            Login
        </button>
        <p style="margin-top: 1rem; color: var(--text-muted);">Don't have an account? <a href="/register" style="color: var(--accent-hover);">Register here</a></p>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 450px;">
    <h2><i class="fa-solid fa-user-shield" style="color: #fbbf24;"></i> Admin Portal</h2>
    <p>Sign in with your master credentials.</p>
    
    <form action="/admin/login" method="POST">
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>Master Username</label>
            <input type="text" name="username" required placeholder="Administrator">
        </div>
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label>Master Key</label>
            <input type="password" name="password" required placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn-primary" style="margin-top: 0; background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);">
            <i class="fa-solid fa-lock-open"></i> Unlock Portal
        </button>
    </form>
</div>
{% endblock %}

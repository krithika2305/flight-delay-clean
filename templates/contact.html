{% extends "base.html" %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 600px;">
    <h2><i class="fa-solid fa-envelope"></i> Contact Us</h2>
    <p>Send a message directly to the administrators.</p>
    
    <form action="/contact" method="POST">
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>Your Name</label>
            <input type="text" name="name" required placeholder="Jane Doe">
        </div>
        
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>Email Address</label>
            <input type="email" name="email" required placeholder="name@example.com">
        </div>
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label>Message</label>
            <textarea name="message" rows="5" required placeholder="How can we help?" style="background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); border-radius: 10px; padding: 0.8rem 1rem; color: var(--text-main); font-size: 1rem; width: 100%; resize: vertical;"></textarea>
        </div>
        
        <button type="submit" class="btn-primary" style="margin-top: 0;">
            <i class="fa-solid fa-paper-plane"></i> Send Message
        </button>
    </form>
</div>
{% endblock %}
